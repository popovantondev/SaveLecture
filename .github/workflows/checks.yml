name: Build and public documentation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Windows app
        shell: powershell
        run: ./Build.ps1
      - name: Storage and filtering acceptance
        shell: powershell
        run: ./tests/RunTests.ps1
      - name: Public contents and local documentation
        run: python tools/CheckPublic.py
  # UI acceptance requires an interactive Windows desktop; it is deliberately run locally.
